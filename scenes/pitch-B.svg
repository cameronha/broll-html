<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"
     data-bg="#E9E1CF" data-finish="cut" data-variants="3" data-border="0" data-bg-boil="0.5" data-zoom="0.95,48,-12">
  <defs>
    <linearGradient id="og" x1="0" x2="1"><stop offset="0" stop-color="#F7B994"/><stop offset=".55" stop-color="#E8692E"/><stop offset="1" stop-color="#A9441A"/></linearGradient>
    <linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#E98A70"/><stop offset="1" stop-color="#9E2E1C"/></linearGradient>
    <linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#C3D1BF"/><stop offset=".55" stop-color="#5F7466"/><stop offset="1" stop-color="#3A4A3F"/></linearGradient>
    <linearGradient id="wg" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9D0BE"/></linearGradient>
    <linearGradient id="ng" x1="0" x2="1"><stop offset="0" stop-color="#5D7699"/><stop offset=".6" stop-color="#25395A"/><stop offset="1" stop-color="#121F35"/></linearGradient>
    <linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#FCE6D2"/><stop offset=".6" stop-color="#E9B48C"/><stop offset="1" stop-color="#B97A55"/></linearGradient>
    <radialGradient id="egg" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#FCE9D8"/><stop offset=".6" stop-color="#E6AE86"/><stop offset="1" stop-color="#A86C48"/></radialGradient>
    <linearGradient id="hair" x1="0" x2="1"><stop offset="0" stop-color="#3E4E6A"/><stop offset="1" stop-color="#0E1828"/></linearGradient>
  </defs>
  <!-- version B: modernist (Malevich / Schlemmer) on the v10 poses; built from v10 "adult editorial cutout": same scene as v9; heads ~1/6 of height, tapered polygons,
       small geometric faces, emotion carried by posture. Sub-parts are <g data-part> (not pieces). -->
  <g id="floor" data-static="1">
    <rect x="-40" y="746" width="1160" height="380" fill="#C9B07E"/>
    <rect x="-40" y="797" width="1160" height="330" fill="#8E9AA6"/>
    <rect x="-40" y="700" width="1160" height="22" fill="#DE4A30"/>
    <path d="M540 797 L-40 1126 L60 1126 Z" fill="#7F8B97"/><path d="M540 797 L1120 1126 L1020 1126 Z" fill="#7F8B97"/>
  </g>
  <g id="chair" fill="#182A46">
    <rect x="110" y="480" width="44" height="300" rx="14" transform="rotate(-8 132 780)"/>
    <rect x="140" y="770" width="18" height="170" rx="6"/>
    <rect x="400" y="770" width="18" height="170" rx="6"/>
    <rect x="120" y="740" width="320" height="40" rx="14"/>
  </g>

  <!-- skeptic: slumped back, arms and legs crossed, head turned away -->
  <g id="customer-legs">
    <path d="M240 718 L438 742 L442 790 L250 772 Z" fill="url(#ng)"/>
    <path d="M410 770 L446 776 L440 934 L408 934 Z" fill="url(#ng)"/>
    <path d="M396 928 L452 924 L470 946 L392 950 Z" fill="#3B2A20"/>
  </g>
  <g id="customer-body">
    <path d="M178 478 L300 466 L338 560 L342 742 L196 746 L186 600 Z" fill="url(#gg)"/>
    <path d="M178 478 L240 472 L246 744 L196 746 L186 600 Z" fill="url(#wg)"/>
    <path d="M258 700 L300 694 L470 712 L462 754 L268 750 Z" fill="url(#ng)"/>
    <g data-part="arms-crossed">
      <path d="M176 486 L206 482 L216 606 L186 612 Z" fill="url(#gg)"/>
      <path d="M296 474 L326 480 L338 598 L308 604 Z" fill="url(#gg)"/>
      <path d="M200 604 L330 596 L332 620 L204 628 Z" fill="url(#gg)"/>
      <path d="M180 596 L204 594 L206 620 L182 622 Z" fill="url(#sg)"/>
      <path d="M186 590 L326 572 L330 598 L190 616 Z" fill="url(#gg)"/>
      <path d="M318 572 L346 568 L348 594 L322 598 Z" fill="url(#sg)"/>
    </g>
    <path d="M226 430 L256 430 L258 474 L226 476 Z" fill="url(#sg)"/>
  </g>
  <g id="customer-head" data-pivot="242,440" data-deg="3" data-freq="0.4" data-shape="sine">
    <ellipse cx="238" cy="378" rx="46" ry="62" fill="url(#egg)" transform="rotate(-14 238 378)"/>
    <path d="M200 350 Q206 312 248 312 Q290 318 292 368 Q290 396 280 410 Q270 360 238 344 Q214 340 200 350 Z" fill="url(#hair)"/>
    <path d="M198 384 Q186 396 196 404 Z" fill="#C98A62"/>
    <path d="M206 378 Q216 372 226 378 Q216 381 206 378 Z" fill="#121F35"/>
    <path d="M204 366 L226 362 L226 366 L204 370 Z" fill="#121F35"/>
    <path d="M206 420 L224 418 L224 422 L206 424 Z" fill="#7A3A28"/>
  </g>
  <g id="customer-foot" data-pivot="466,732" data-deg="-9" data-freq="2.2" data-shape="snap">
    <path d="M446 714 L484 724 L550 848 L518 862 Z" fill="url(#ng)"/>
    <path d="M508 848 L560 840 L586 868 L518 876 Z" fill="#3B2A20"/>
  </g>

  <!-- salesperson: leans in, hand on hip, tablet pushed close to the customer's face -->
  <g id="founder">
    <g data-part="legs">
      <path d="M712 600 L768 604 L690 936 L650 936 Z" fill="url(#ng)"/>
      <path d="M768 604 L822 598 L900 936 L858 938 Z" fill="url(#ng)"/>
      <path d="M600 934 L684 928 L694 956 L596 960 Z" fill="#F6EEDC"/>
      <path d="M842 934 L910 930 L926 956 L838 960 Z" fill="#F6EEDC"/>
    </g>
    <g data-part="far-arm">
      <path d="M816 356 L852 370 L922 480 L896 500 Z" fill="url(#rg)"/>
      <path d="M896 478 L924 498 L850 592 L826 572 Z" fill="url(#rg)"/>
      <path d="M812 566 L840 578 L830 604 L806 592 Z" fill="url(#sg)"/>
    </g>
    <g data-part="torso">
      <path d="M672 336 L836 350 L850 470 L836 628 L704 628 L690 500 Z" fill="url(#og)"/>
      <path d="M770 344 L836 350 L850 470 L836 628 L772 628 Z" fill="url(#rg)"/>
      <path d="M700 598 L838 602 L836 632 L704 632 Z" fill="url(#rg)"/>
      <path d="M716 322 L800 326 L808 354 L760 370 L712 352 Z" fill="url(#rg)"/>
      <rect x="740" y="362" width="7" height="58" fill="#F6EEDC" transform="rotate(4 743 362)"/>
      <rect x="764" y="364" width="7" height="54" fill="#F6EEDC" transform="rotate(4 767 364)"/>
    </g>
    <path d="M738 296 L764 298 L770 336 L734 336 Z" fill="url(#sg)"/>
  </g>
  <g id="founder-head" data-pivot="752,330" data-deg="-4" data-freq="1.1" data-shape="snap">
    <ellipse cx="748" cy="250" rx="46" ry="62" fill="url(#egg)" transform="rotate(10 748 250)"/>
    <path d="M704 230 Q708 190 752 188 Q796 192 800 240 Q800 270 790 282 Q782 236 752 220 Q722 214 704 230 Z" fill="url(#hair)"/>
    <path d="M706 252 Q692 266 704 274 Z" fill="#C98A62"/>
    <path d="M714 244 Q724 238 734 244 Q724 248 714 244 Z" fill="#121F35"/>
    <path d="M712 232 L736 230 L736 234 L712 236 Z" fill="#121F35"/>
    <path d="M716 290 Q728 296 740 288 L740 292 Q728 300 716 294 Z" fill="#9B3A24"/>
  </g>
  <g id="arm" data-pivot="690,370" data-deg="7" data-freq="1.1" data-shape="snap">
    <g data-part="upper-arm"><path d="M675 352 L705 378 L605 491 L575 465 Z" fill="url(#og)"/></g>
    <g data-part="forearm"><circle cx="590" cy="478" r="19" fill="url(#og)"/><path d="M600 465 L580 491 L482 413 L502 387 Z" fill="url(#og)"/></g>
    <g data-part="tablet" transform="rotate(-10 420 380)">
      <rect x="360" y="300" width="120" height="160" rx="8" fill="#182A46"/>
      <rect x="370" y="310" width="100" height="140" rx="3" fill="#F6EEDC"/>
      <rect x="384" y="404" width="18" height="34" fill="#ED7239"/>
      <rect x="410" y="384" width="18" height="54" fill="#DE4A30"/>
      <rect x="436" y="350" width="18" height="88" fill="url(#og)"/>
    </g>
    <g data-part="hand"><path d="M466 372 L496 368 L502 402 L474 408 Z" fill="url(#sg)"/></g>
  </g>
</svg>
