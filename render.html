<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#f2efe8}canvas{display:block}</style>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
// Deterministic: window.renderAt(frame) draws one frame. render.py drives it.
const F = 1080, FPS = 24, STEP = 2;           // shoot on twos
const BOIL_PX = 1.0, BOIL_DEG = 0.35;
const c = document.getElementById('c'), ctx = c.getContext('2d');
let M, BG, BGS, IMGS, VARS, SCENE;   // SCENE = the motion function

function rand(a, b) {                          // hash -> [0,1)
  let h = (a * 374761393 + b * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const smooth = t => t * t * (3 - 2 * t);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const easeIn = t => t * t * t;

function boil(i, f) {                          // held for STEP frames
  const k = Math.floor(f / STEP);
  return [(rand(i, k) - .5) * 2 * BOIL_PX, (rand(i + 99, k) - .5) * 2 * BOIL_PX,
          (rand(i + 7, k) - .5) * 2 * BOIL_DEG * Math.PI / 180];
}

function drawPiece(img, p, dx, dy, rot, sc, shadow) {
  const cx = p.x + p.w / 2 + dx, cy = p.y + p.h / 2 + dy;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = 10 * shadow; ctx.shadowOffsetX = 5 * shadow; ctx.shadowOffsetY = 7 * shadow;
  ctx.drawImage(img, -p.w / 2, -p.h / 2);
  ctx.restore();
}

function camera(t, dur, push) {                // slow smooth push, no boil on camera
  const z = 1 + push * smooth(clamp(t / dur, 0, 1));
  ctx.setTransform(z, 0, 0, z, F / 2 * (1 - z), F / 2 * (1 - z));
}

const easeOutBack = t => { const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function order(n, seed) {                      // stable shuffle
  return [...Array(n).keys()].sort((a, b) => rand(a, seed) - rand(b, seed));
}

// Motions are generic: each reads M (manifest) and draws one frame at time t.
const motions = {
  // pieces hop and fall out of frame one by one
  fall(f, t) {
    camera(t, M.dur, 0.05);
    ctx.drawImage(BG, 0, 0);
    M.pieces.forEach((p, i) => {
      const [bx, by, br] = boil(i, f);
      const u = Math.max(0, t - (1.0 + M.stagger * i));
      const vx = (rand(i, 1) - .5) * 260, spin = (rand(i, 2) - .5) * 4;
      drawPiece(IMGS[i], p, bx + vx * u, by - 180 * u + 1300 * u * u, br + spin * u,
                1 + Math.min(u, .1) * .4, 1 + Math.min(u * 6, 1.5));
    });
  },
  // each piece lifts, then flies away from centre
  peel(f, t) {
    camera(t, M.dur, 0.06);
    ctx.drawImage(BG, 0, 0);
    const ord = order(M.pieces.length, 5);
    M.pieces.map((p, i) => [p, i, ord.indexOf(i)]).sort((a, b) => b[2] - a[2]).forEach(([p, i, k]) => {
      const [bx, by, br] = boil(i, f);
      const t0 = 0.9 + M.stagger * k, lift = smooth(clamp((t - t0) / 0.18, 0, 1));
      const u = clamp((t - t0 - 0.18) / 0.7, 0, 1);
      const cx = p.x + p.w / 2 - F / 2, cy = p.y + p.h / 2 - F / 2, n = Math.hypot(cx, cy) || 1;
      const d = 1800 * easeIn(u);
      drawPiece(IMGS[i], p, bx + cx / n * d, by + cy / n * d - 14 * lift,
                br + (rand(i, 3) - .5) * 1.2 * u, 1 + .04 * lift, 1 + 1.6 * lift);
    });
  },
  // pieces fly in from outside and build the picture, with overshoot
  assemble(f, t) {
    camera(t, M.dur, 0.05);
    ctx.drawImage(BG, 0, 0);
    const ord = order(M.pieces.length, 9);
    M.pieces.forEach((p, i) => {
      const t0 = 0.25 + M.stagger * ord.indexOf(i), u = clamp((t - t0) / 0.5, 0, 1);
      if (u <= 0) return;
      const e = easeOutBack(u), [bx, by, br] = u < 1 ? [0, 0, 0] : boil(i, f);
      const cx = p.x + p.w / 2 - F / 2, cy = p.y + p.h / 2 - F / 2, n = Math.hypot(cx, cy) || 1;
      const ang = Math.atan2(cy, cx) + (rand(i, 4) - .5) * 0.8, d = 1300 * (1 - e);
      drawPiece(IMGS[i], p, bx + Math.cos(ang) * d, by + Math.sin(ang) * d,
                br + (rand(i, 5) - .5) * 0.6 * (1 - e), 1, 1 + 1.2 * (1 - u));
    });
  },
  // pieces drop from above, bottom first, and land with a small bounce
  stack(f, t) {
    camera(t, M.dur, 0.04);
    ctx.drawImage(BG, 0, 0);
    const ord = M.pieces.map((p, i) => i).sort((a, b) => M.pieces[b].y - M.pieces[a].y);
    ord.forEach((i, k) => {
      const p = M.pieces[i], t0 = 0.3 + M.stagger * k, u = t - t0;
      if (u <= 0) return;
      const fallT = 0.32, h = p.y + p.h + 60;
      let dy;
      if (u < fallT) dy = -h * (1 - (u / fallT) ** 2);
      else { const b = u - fallT; dy = -Math.max(0, 28 * Math.sin(b * Math.PI / 0.18)) * (b < 0.18 ? 1 : 0); }
      const [bx, by, br] = u > fallT + 0.18 ? boil(i, f) : [0, 0, 0];
      drawPiece(IMGS[i], p, bx, by + dy, br + (rand(i, 6) - .5) * 0.04, 1, 1);
    });
  },
  // subject and background push at different rates: depth
  parallax(f, t) {
    const u = smooth(clamp(t / M.dur, 0, 1));
    const zb = 1 + 0.04 * u, zs = 1 + 0.11 * u;
    ctx.setTransform(zb, 0, 0, zb, F / 2 * (1 - zb), F / 2 * (1 - zb));
    ctx.drawImage(BG, -M.ox, -M.oy);
    ctx.setTransform(zs, 0, 0, zs, F / 2 * (1 - zs), F / 2 * (1 - zs));
    const [bx, by, br] = boil(0, f);
    drawPiece(IMGS[0], M.pieces[0], bx, by, br, 1, 1.3);
  },
  // Gilliam hinge: top piece swings open and shut about a point on the cut, jerky, on twos.
  // M.hinge = [x position along the cut 0..1, max angle in degrees]
  hinge(f, t) {
    camera(t, M.dur, 0.04);
    ctx.drawImage(BG, 0, 0);
    // hinged piece: the topmost one, or (SVG scenes, M.pivot set) the last one, about M.pivot
    let ps = M.pieces.map((p, i) => [p, i]);
    if (!M.pivot) ps.sort((a, b) => b[0].y - a[0].y);
    const [top, ti] = ps[ps.length - 1], k = Math.floor(f / STEP) * STEP / FPS;
    ps.slice(0, -1).forEach(([p, i]) => { const [bx, by, br] = boil(i, f); drawPiece(IMGS[i], p, bx, by, br, 1, 1.2); });
    const open = Math.max(0, Math.sin(k * Math.PI * 2.2)) ** 0.6;       // snap open, hold, drop shut
    const [hx, hy] = M.pivot || [top.x + top.w * M.hinge[0], top.y + top.h];
    const [bx, by] = boil(ti, f);
    ctx.save();
    ctx.translate(hx + bx, hy + by); ctx.rotate(-open * M.hinge[1] * Math.PI / 180); ctx.translate(-hx, -hy);
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 12; ctx.shadowOffsetX = 6; ctx.shadowOffsetY = 8;
    ctx.drawImage(IMGS[ti], top.x, top.y);
    ctx.restore();
  },
  // SVG puppet: every piece with a rig swings on its own pivot; edges boil through seed variants
  rig(f, t) {
    camera(t, M.dur, 0.04);
    const [jx, jy] = boil(999, f);                 // shot frame by frame: the sheet shifts ~1px
    const bgi = BGS[Math.floor(f / (M.boil_step || STEP)) % BGS.length];
    if (M.transparent) {} else if (M.bg_life) ctx.drawImage(bgi, jx * 1.2 * (M.jitter ?? 1) - 4, jy * 1.2 * (M.jitter ?? 1) - 4, F + 8, F + 8); else ctx.drawImage(bgi, 0, 0);
    const st = M.step || STEP, J = (M.jitter ?? 1) * .5, SH = M.shadow ?? 0.6;
    const k = Math.floor(f / st), tq = k * st / FPS;
    M.pieces.forEach((p, i) => {
      if (p.show && (t < p.show[0] || t >= p.show[1])) return;   // timed group (expression swap)
      const img = VARS[i][Math.floor(f / (M.boil_step || STEP)) % VARS[i].length], [bx, by, br] = boil(i, f);
      if (!p.rig) return drawPiece(img, p, bx * J, by * J, br * J, 1, SH);
      const R = p.rig, s = Math.sin(2 * Math.PI * (R.freq * tq + R.phase));
      const a = (R.shape === 'sine' ? s : Math.max(0, s) ** 0.6) * R.deg * Math.PI / 180;
      const [hx, hy] = R.pivot;
      ctx.save();
      ctx.translate(hx, hy); ctx.rotate(a); ctx.translate(-hx, -hy);
      drawPiece(img, p, bx * J, by * J, br * J, 1, SH);
      ctx.restore();
    });
    if (M.bg_life && !M.transparent) {             // light flicker, on twos
      const fl = (rand(998, k) - .5) * 0.035;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = fl > 0 ? `rgba(255,250,240,${fl})` : `rgba(24,42,70,${-fl})`;
      ctx.fillRect(0, 0, F, F);
    }
  },
  // subject crosses the frame; a photo plate (if any) pans the other way
  cross(f, t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const u = t / M.dur, dir = M.dir;
    if (M.bg_w) {
      const room = Math.max(0, Math.min(80, M.bg_w - F));
      ctx.drawImage(BG, -clamp(M.ox + dir * room * (0.5 - u), 0, M.bg_w - F), -M.oy);
    } else ctx.drawImage(BG, 0, 0);
    const p = M.pieces[0], [bx, by, br] = boil(0, f);
    const k = Math.floor(f / STEP) * STEP / FPS;
    const start = dir > 0 ? -p.x - p.w : F - p.x, end = dir > 0 ? F - p.x : -p.x - p.w;
    const x = start + (end - start) * u;
    const bob = -Math.abs(Math.sin(k * Math.PI * 3)) * 12;
    drawPiece(IMGS[0], p, bx + x, by + bob, br + Math.sin(k * Math.PI * 3) * 0.03, 1, 1.3);
  },
};

function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }

window.setup = async (base) => {
  M = await (await fetch(base + '/manifest.json')).json();
  SCENE = motions[M.motion];
  BGS = await Promise.all((M.bgs || [M.bg]).map(s => load(base + '/' + s)));
  BG = BGS[0];
  VARS = await Promise.all(M.pieces.map(p => Promise.all((p.srcs || [p.src]).map(s => load(base + '/' + s)))));
  IMGS = VARS.map(v => v[0]);
  return Math.round(M.dur * FPS);
};
window.renderAt = f => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (M.transparent) ctx.clearRect(0, 0, F, F); else { ctx.fillStyle = '#f2efe8'; ctx.fillRect(0, 0, F, F); }
  SCENE(f, f / FPS);
  return c.toDataURL('image/png');
};
</script>
